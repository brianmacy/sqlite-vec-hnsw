
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.actix]
url = "https://raw.githubusercontent.com/actix/supply-chain/main/audits.toml"

[imports.ariel-os]
url = "https://raw.githubusercontent.com/ariel-os/ariel-os/main/supply-chain/audits.toml"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.fermyon]
url = "https://raw.githubusercontent.com/fermyon/spin/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.libsqlite3-sys]
audit-as-crates-io = true

[policy.rusqlite]
audit-as-crates-io = true

[[exemptions.bytemuck]]
version = "1.25.2"
criteria = "safe-to-deploy"
notes = "Zero-copy casts of vector buffers, used directly (shipped). Publisher Lokathor; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.bytemuck_derive]]
version = "1.10.2"
criteria = "safe-to-deploy"
notes = "Derive macros for bytemuck (shipped code generation). Publisher Lokathor; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.criterion]]
version = "0.8.2"
criteria = "safe-to-run"
notes = "Benchmark harness (dev-dependency); DEV-ONLY (benchmarks), safe-to-run. Published via crates.io trusted publishing from github:criterion-rs/criterion.rs, which no imported audit set trusts or audits."

[[exemptions.fixedbitset]]
version = "0.5.7"
criteria = "safe-to-deploy"
notes = "Visited-node bitset in HNSW search, used directly (shipped). Publisher james7132; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.half]]
version = "2.7.1"
criteria = "safe-to-run"
notes = "f16/bf16 types via criterion -> ciborium; DEV-ONLY (benchmarks), safe-to-run. Publisher VoidStarKat; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.js-sys]]
version = "0.3.95"
criteria = "safe-to-deploy"
notes = "JS bindings via rusqlite -> sqlite-wasm-rs (wasm32 targets only; not built for native targets). This version was published by guybedford; only alexcrichton-published versions are trusted."

[[exemptions.libsqlite3-sys]]
version = "0.36.0@git:18ce4dbced5f56faf4e3b5368f285253e795232c"
criteria = "safe-to-deploy"
notes = "Raw SQLite FFI + bundled SQLite build from Brian's rusqlite fork (shipped); audit-as-crates-io policy. Git fork, so neither trust entries nor imported audits can apply."

[[exemptions.pkg-config]]
version = "0.3.33"
criteria = "safe-to-deploy"
notes = "Build-time system-library discovery for libsqlite3-sys. Publisher sdroege; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.plotters]]
version = "0.3.7"
criteria = "safe-to-run"
notes = "Chart rendering for criterion reports; DEV-ONLY (benchmarks), safe-to-run. Publisher AaronErhardt; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.plotters-backend]]
version = "0.3.7"
criteria = "safe-to-run"
notes = "Backend trait for plotters (criterion reports); DEV-ONLY (benchmarks), safe-to-run. Publisher AaronErhardt; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.plotters-svg]]
version = "0.3.7"
criteria = "safe-to-run"
notes = "SVG backend for plotters (criterion reports); DEV-ONLY (benchmarks), safe-to-run. Publisher AaronErhardt; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.r-efi]]
version = "6.0.0"
criteria = "safe-to-run"
notes = "UEFI bindings pulled in by getrandom (UEFI targets only). Publisher dvdhrm; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.rsqlite-vfs]]
version = "0.1.0"
criteria = "safe-to-deploy"
notes = "SQLite VFS for the wasm build of rusqlite (via sqlite-wasm-rs; wasm32 targets only). Publisher Spxg; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.rusqlite]]
version = "0.38.0@git:18ce4dbced5f56faf4e3b5368f285253e795232c"
criteria = "safe-to-deploy"
notes = "SQLite bindings from Brian's fork (github.com/brianmacy/rusqlite, custom-vtab-features) used directly (shipped); audit-as-crates-io policy. Git fork, so neither trust entries nor imported audits can apply."

[[exemptions.simsimd]]
version = "6.5.16"
criteria = "safe-to-deploy"
notes = "SIMD distance kernels (C library + Rust bindings), used directly (shipped). Publisher ashvardanian; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.sqlite-wasm-rs]]
version = "0.5.2"
criteria = "safe-to-deploy"
notes = "SQLite compiled for wasm, optional backend of rusqlite (wasm32 targets only). Publisher Spxg; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.wasm-bindgen]]
version = "0.2.118"
criteria = "safe-to-deploy"
notes = "wasm-bindgen runtime via rusqlite -> sqlite-wasm-rs -> js-sys (wasm32 targets only). This version was published by guybedford; only alexcrichton-published versions are trusted."

[[exemptions.wasm-bindgen-macro]]
version = "0.2.118"
criteria = "safe-to-deploy"
notes = "wasm-bindgen proc macro (wasm32 targets only, via sqlite-wasm-rs). This version was published by guybedford; only alexcrichton-published versions are trusted."

[[exemptions.wasm-bindgen-macro-support]]
version = "0.2.118"
criteria = "safe-to-deploy"
notes = "wasm-bindgen macro implementation (wasm32 targets only, via sqlite-wasm-rs). This version was published by guybedford; only alexcrichton-published versions are trusted."

[[exemptions.wasm-bindgen-shared]]
version = "0.2.118"
criteria = "safe-to-deploy"
notes = "Shared wasm-bindgen definitions (wasm32 targets only, via sqlite-wasm-rs). This version was published by guybedford; only alexcrichton-published versions are trusted."

[[exemptions.web-sys]]
version = "0.3.95"
criteria = "safe-to-run"
notes = "Web API bindings pulled in by plotters (criterion, wasm32 only); DEV-ONLY (benchmarks), safe-to-run. This version was published by guybedford; only alexcrichton-published versions are trusted."

[[exemptions.winapi-i686-pc-windows-gnu]]
version = "0.4.0"
criteria = "safe-to-run"
notes = "Windows import-library shim via criterion -> page_size -> winapi (Windows-gnu only); DEV-ONLY (benchmarks), safe-to-run. crates.io has no publisher record for this 2018 release, so no trust entry is possible."

[[exemptions.winapi-x86_64-pc-windows-gnu]]
version = "0.4.0"
criteria = "safe-to-run"
notes = "Windows import-library shim via criterion -> page_size -> winapi (Windows-gnu only); DEV-ONLY (benchmarks), safe-to-run. crates.io has no publisher record for this 2018 release, so no trust entry is possible."

[[exemptions.zerocopy]]
version = "0.8.48"
criteria = "safe-to-run"
notes = "Safe transmute helpers via criterion -> ciborium -> half; DEV-ONLY (benchmarks), safe-to-run. Publisher joshlf; publisher not in any imported [[trusted]] set and no imported audit covers this version."

[[exemptions.zerocopy-derive]]
version = "0.8.48"
criteria = "safe-to-run"
notes = "Derive macros for zerocopy via criterion -> ciborium -> half; DEV-ONLY (benchmarks), safe-to-run. Publisher joshlf; publisher not in any imported [[trusted]] set and no imported audit covers this version."
